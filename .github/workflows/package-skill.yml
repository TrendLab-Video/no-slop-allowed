name: Package skill

on:
  push:
    branches: [main, staging]
    tags: ['v*']
    paths: ['skill/**', 'docs/CONTRACTS.md', 'scripts/package-skill.sh', '.github/workflows/package-skill.yml']
  pull_request:
    paths: ['skill/**', 'docs/CONTRACTS.md', 'scripts/package-skill.sh']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # only used to attach the zip to a release on v* tags
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check, smoke test and package
        run: scripts/package-skill.sh "${GITHUB_REF_NAME}-${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v4
        with:
          name: recliner-skill
          path: dist/recliner-skill.zip
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/recliner-skill.zip --title "Recliner skill $TAG" --generate-notes || gh release upload "$TAG" dist/recliner-skill.zip --clobber
