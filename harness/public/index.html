<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>36 Labs · Creative Harness</title>

</head>
<body>

<header class="ds-topbar">
  <a href="#" id="home-link" class="ds-brand" title="Back to overview">
    <svg class="ds-logo" viewBox="1 0 72 28" role="img" aria-label="36 Labs" xmlns="http://www.w3.org/2000/svg">
      <g transform="translate(0 21.76) scale(.034 -.034)">
        <path d="M582 171 580 176Q676 176 756.5 172.0Q837 168 896.0 154.0Q955 140 987.5 110.0Q1020 80 1020 27Q1020 -39 959.5 -83.0Q899 -127 787.0 -149.0Q675 -171 521 -171Q365 -171 256.5 -142.5Q148 -114 91.5 -59.0Q35 -4 35 77H286Q288 55 319.5 42.5Q351 30 404.0 24.5Q457 19 521 19Q640 19 697.5 28.5Q755 38 755 77Q755 115 685.0 124.0Q615 133 480 133H331V203H480Q579 203 636.0 208.5Q693 214 716.5 227.5Q740 241 740 263Q740 295 688.5 307.5Q637 320 526 320Q420 320 355.5 302.5Q291 285 287 252H38Q38 319 76.0 368.0Q114 417 181.5 448.5Q249 480 337.5 495.0Q426 510 526 510Q678 510 783.5 490.5Q889 471 944.5 432.0Q1000 393 1000 333Q1000 284 969.0 253.0Q938 222 882.0 204.5Q826 187 749.5 180.0Q673 173 582 171Z"></path>
        <g transform="translate(1015 0)"><path d="M692 440Q826 440 916.5 411.0Q1007 382 1052.5 331.0Q1098 280 1098 214Q1098 148 1047.0 95.0Q996 42 888.0 11.0Q780 -20 610 -20Q420 -20 291.0 4.0Q162 28 96.0 77.0Q30 126 30 202Q30 226 41.5 258.0Q53 290 92 325Q97 330 120.5 349.5Q144 369 179.0 397.5Q214 426 254.0 459.0Q294 492 333.0 524.0Q372 556 404.5 582.0Q437 608 456.5 624.0Q476 640 476 640H814L180 202L117 152Q195 222 260.5 276.0Q326 330 390.5 366.5Q455 403 527.5 421.5Q600 440 692 440ZM588 151Q714 151 781.0 167.0Q848 183 848 219Q848 252 781.0 271.0Q714 290 588 290Q446 290 363.0 271.0Q280 252 280 219Q280 183 363.0 167.0Q446 151 588 151Z"></path></g>
      </g>
    </svg>
    <span class="ds-brand-sep"></span>
    <span class="ds-brand-title">creative harness</span>
  </a>

  <nav class="ds-tabs" id="stage-tabs" hidden aria-label="Stage view filter">
    <button type="button" class="ds-tab is-active" data-tab="all">All stages</button>
    <button type="button" class="ds-tab" data-tab="winner">Winner</button>
    <button type="button" class="ds-tab" data-tab="video">Video <span class="ds-tab-count" id="cnt-video"></span></button>
    <button type="button" class="ds-tab" data-tab="develop">Develop <span class="ds-tab-count" id="cnt-develop"></span></button>
    <button type="button" class="ds-tab" data-tab="diverge">Diverge <span class="ds-tab-count" id="cnt-diverge"></span></button>
    <button type="button" class="ds-tab" data-tab="select">Select <span class="ds-tab-count" id="cnt-select"></span></button>
    <button type="button" class="ds-tab" data-tab="trace">Trace <span class="ds-tab-count" id="cnt-trace"></span></button>
  </nav>

  <div class="ds-topbar-right">
    <span id="mode" class="ds-badge">…</span>
    <span id="status" class="ds-badge" hidden></span>
    <span class="ds-telemetry" id="stats"></span>
    <a href="/stylebook" class="ds-btn ds-btn--subtle">
      Style book
      <svg class="ic" width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8h11M9 3.5 13.5 8 9 12.5"/></svg>
    </a>
  </div>

  <div class="ds-topbar-progress" id="progress"></div>
</header>

<main class="app-shell">
  <aside class="app-rail">
    <div class="ds-field">
      <label for="presets">Brief Preset</label>
      <select id="presets" class="ds-select"><option value="">Load a starter brief…</option></select>
    </div>

    <div class="ds-field">
      <label for="brief">Creative Brief</label>
      <textarea id="brief" class="ds-textarea" placeholder="Paste what is being promoted and the objective…"></textarea>
    </div>

    <div class="ds-param-grid">
      <div class="ds-field">
        <label for="concepts">Concepts</label>
        <input id="concepts" class="ds-input" type="number" min="2" max="16" />
      </div>
      <div class="ds-field">
        <label for="finalists">Finalists</label>
        <input id="finalists" class="ds-input" type="number" min="1" max="6" />
      </div>
      <div class="ds-field">
        <label for="iters">Revisions</label>
        <input id="iters" class="ds-input" type="number" min="0" max="6" />
      </div>
    </div>

    <label class="ds-toggle-row" for="video">
      <span class="ds-label" style="color:var(--ink)">Animate winner (video)</span>
      <input id="video" class="ds-switch" type="checkbox" />
    </label>

    <button id="go" class="ds-btn ds-btn--primary ds-btn--full">
      Run harness
      <svg class="ic" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8h11M9 3.5 13.5 8 9 12.5"/></svg>
    </button>

    <div id="outputs-rail-wrap" hidden>
      <div style="margin-top:0.4rem;display:flex;align-items:baseline;justify-content:space-between">
        <p class="t-eyebrow">Deliverables</p>
        <span class="t-eyebrow" id="outputs-count"></span>
      </div>
      <div class="app-rail-runs" id="outputs-rail"></div>
    </div>

    <div style="margin-top:0.35rem;display:flex;align-items:baseline;justify-content:space-between">
      <p class="t-eyebrow">Runs</p>
      <span class="t-eyebrow" id="runs-count"></span>
    </div>
    <div class="app-rail-runs" id="runs"></div>
  </aside>

  <div class="app-canvas" id="view"></div>
</main>

<dialog id="lightbox" class="ds-lightbox">
  <div id="lightbox-content"></div>
</dialog>

<script>
const $ = (id) => document.getElementById(id)
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]))
const arrowSvg = `<svg class="ic" width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8h11M9 3.5 13.5 8 9 12.5"/></svg>`
const extSvg = `<svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 11 11 5M6 5h5v5"/></svg>`

let current = location.hash.slice(1) || null
let timer = null
let activeTab = 'all'
let loadedBriefs = []
let loadedOutputs = []
let lastRun = null
let lastKey = ''

// Cursor-following radial border highlight (from 36labs.ai .panel::after)
document.addEventListener('pointermove', (e) => {
  const panel = e.target.closest?.('.ds-panel--spotlight')
  if (!panel) return
  const r = panel.getBoundingClientRect()
  panel.style.setProperty('--mx', (e.clientX - r.left) + 'px')
  panel.style.setProperty('--my', (e.clientY - r.top) + 'px')
})

async function boot() {
  const [health, briefs, outputs] = await Promise.all([
    fetch('/api/health').then((r) => r.json()),
    fetch('/api/briefs').then((r) => r.json()).catch(() => []),
    fetch('/api/outputs').then((r) => (r.ok ? r.json() : [])).catch(() => []),
  ])

  $('mode').textContent = health.mock ? 'mock mode' : 'live fal'
  $('mode').className = 'ds-badge ' + (health.mock ? 'ds-badge--mock' : 'ds-badge--live')
  $('concepts').value = health.defaults.concepts
  $('finalists').value = health.defaults.finalists
  $('iters').value = health.defaults.maxIters
  $('video').checked = health.defaults.video

  loadedBriefs = briefs
  loadedOutputs = Array.isArray(outputs) ? outputs : []

  for (const b of loadedBriefs) {
    $('presets').insertAdjacentHTML('beforeend', `<option value="${esc(b.name)}">${esc(b.name)}</option>`)
  }
  $('presets').onchange = () => {
    const b = loadedBriefs.find((x) => x.name === $('presets').value)
    if (b) $('brief').value = b.text
  }
  $('go').onclick = start
  $('home-link').onclick = (e) => {
    e.preventDefault()
    current = null
    lastRun = null
    lastKey = ''
    history.replaceState(null, '', location.pathname)
    clearTimeout(timer)
    renderEmpty()
    renderOutputsRail()
    refreshRuns().catch(() => {})
  }

  for (const btn of $('stage-tabs').querySelectorAll('.ds-tab')) {
    btn.onclick = () => {
      activeTab = btn.dataset.tab
      for (const t of $('stage-tabs').querySelectorAll('.ds-tab')) t.classList.toggle('is-active', t === btn)
      lastKey = ''
      if (lastRun) render(lastRun)
    }
  }

  $('lightbox').onclick = (e) => { if (e.target === $('lightbox')) $('lightbox').close() }
  $('lightbox').addEventListener('close', () => {
    for (const v of $('lightbox-content').querySelectorAll('video')) v.pause()
  })

  renderOutputsRail()
  await refreshRuns()
  if (current) routeTo(current)
  else renderEmpty()
}

function renderOutputsRail() {
  if (!loadedOutputs.length) {
    $('outputs-rail-wrap').hidden = true
    return
  }
  $('outputs-rail-wrap').hidden = false
  $('outputs-count').textContent = String(loadedOutputs.length)
  $('outputs-rail').innerHTML = loadedOutputs.map((d) => {
    const key = 'output:' + d.slug
    return `<a href="#${esc(key)}" data-slug="${esc(d.slug)}" class="run-link ${current === key ? 'is-active' : ''}">
      <span class="run-dot done"></span>
      <span class="run-link-body">
        <span class="run-link-id">outputs/${esc(d.slug)}</span>
        <span class="run-link-brief">${esc(d.briefTitle || d.conceptTitle || d.slug)}</span>
      </span>
      ${arrowSvg}
    </a>`
  }).join('')

  for (const a of $('outputs-rail').querySelectorAll('a.run-link')) {
    a.onclick = (e) => { e.preventDefault(); openDeliverable(a.dataset.slug) }
  }
}

function formatShotPrompt(text) {
  const s = esc(text)
  return s.replace(/\bSound:\s*/gi, '<span class="shot-sound">Sound</span> ')
}

function shortEndpoint(ep) {
  return String(ep ?? '').replace(/^(mock:)?fal-ai\//, '$1').replace(/\/image-to-video$/, '')
}

function effScore(crit) {
  if (!crit) return 0
  return Math.round((crit.score - (crit.slop?.length ?? 0)) * 10) / 10
}

function outputHref(p) {
  if (!p) return null
  const norm = String(p).replace(/\\/g, '/')
  if (norm.startsWith('/outputs/')) return norm
  const idx = norm.lastIndexOf('/outputs/')
  if (idx >= 0) return norm.slice(idx)
  if (norm.startsWith('outputs/')) return '/' + norm
  return null
}

function renderOutputsBar(outputs) {
  if (!outputs) return ''
  const videoHref = outputHref(outputs.video)
  const imageHref = outputHref(outputs.image)
  const tracesHref = outputHref(outputs.traces)
  const dirNorm = String(outputs.dir ?? '').replace(/\\/g, '/').replace(/^\.\.\//, '')
  const links = [
    videoHref ? `<a class="outputs-link" href="${esc(videoHref)}" target="_blank" rel="noopener">final.mp4 ${extSvg}</a>` : '',
    imageHref ? `<a class="outputs-link" href="${esc(imageHref)}" target="_blank" rel="noopener">${esc(imageHref.split('/').pop() || 'keyframe')} ${extSvg}</a>` : '',
    tracesHref ? `<a class="outputs-link" href="${esc(tracesHref)}" target="_blank" rel="noopener">traces.json ${extSvg}</a>` : '',
  ].filter(Boolean).join('')

  return `<div class="outputs-bar">
    <span class="outputs-bar-left">
      <span class="outputs-dot"></span>
      <span>SAVED · <strong style="color:var(--ink-strong)">${esc(dirNorm || 'outputs')}</strong></span>
    </span>
    ${links ? `<span class="outputs-bar-links">${links}</span>` : ''}
  </div>`
}

function renderEmpty() {
  $('status').hidden = true
  $('stage-tabs').hidden = true
  $('stats').textContent = ''
  $('progress').style.width = '0%'
  $('progress').className = 'ds-topbar-progress'

  const pills = loadedBriefs.map((b) =>
    `<button type="button" class="ds-btn ds-btn--outline js-preset-pill" data-name="${esc(b.name)}">${esc(b.name)} ${arrowSvg}</button>`
  ).join('')

  const deliverablesHtml = loadedOutputs.length ? `
    <section class="deliverables-section">
      <div class="stage-head" style="margin-bottom:0.15rem">
        <div>
          <p class="t-eyebrow">00 / Pre-Rendered Deliverables</p>
          <h2 class="t-headline" style="font-size:1.45rem;margin-top:0.2rem">Shipped outputs</h2>
        </div>
        <span class="t-eyebrow">${loadedOutputs.length} deliverable${loadedOutputs.length > 1 ? 's' : ''} · /outputs</span>
      </div>
      <div class="deliverables-list">
        ${loadedOutputs.map((d) => {
          const totalSecs = (d.shots ?? []).reduce((a, s) => a + (s.seconds || 0), 0)
          const mediaEl = d.videoUrl
            ? `<video src="${esc(d.videoUrl)}" ${d.keyframeUrl ? `poster="${esc(d.keyframeUrl)}"` : ''} autoplay loop muted playsinline controls preload="metadata"></video>`
            : d.keyframeUrl
              ? `<img src="${esc(d.keyframeUrl)}" loading="lazy" alt="${esc(d.slug)}" />`
              : ''
          return `<article class="ds-panel ds-panel--spotlight deliverable-card">
            <div class="deliverable-grid">
              <div class="cv-box cv-box--green">
                <div class="render-top"><span class="cv-plate">DELIVERABLE · ${esc(d.slug.toUpperCase())}</span></div>
                <div class="media-frame" style="cursor:default">${mediaEl}</div>
              </div>
              <div class="deliverable-body">
                <div>
                  <p class="t-eyebrow" style="color:var(--cv-green)">${esc(d.briefTitle)}${d.axis ? ` · ${esc(d.axis)}` : ''}</p>
                  <h3 class="t-headline" style="font-size:1.55rem;margin-top:0.25rem">${esc(d.conceptTitle || d.briefTitle || d.slug)}</h3>
                </div>
                ${d.hook ? `<p class="t-statement" style="font-size:1rem;color:var(--ink)">${esc(d.hook)}</p>` : ''}
                <div class="render-chips">
                  ${d.shots?.length ? `<span class="ds-chip ds-chip--ok">${d.shots.length} shots · ${totalSecs}s</span>` : ''}
                  ${d.conceptsCount ? `<span class="ds-chip">${d.conceptsCount} concepts</span>` : ''}
                  ${d.stepsCount ? `<span class="ds-chip">${d.stepsCount} model calls</span>` : ''}
                  ${d.spendUsd != null ? `<span class="ds-chip">~$${Number(d.spendUsd).toFixed(2)}</span>` : ''}
                  ${d.imageScore != null ? `<span class="ds-chip">hero ${d.imageScore}/10</span>` : ''}
                  ${d.videoScore != null ? `<span class="ds-chip ${d.slopCount ? 'ds-chip--warn' : 'ds-chip--ok'}">video ${d.videoScore}/10</span>` : ''}
                </div>
                ${(d.shots ?? []).length ? `
                  <div class="shot-list">
                    ${d.shots.map((s, i) => `
                      <div class="shot-row">
                        <span class="shot-tag">S${i + 1} · ${s.seconds}s</span>
                        <span class="shot-text">${formatShotPrompt(s.prompt)}</span>
                      </div>`).join('')}
                  </div>` : ''}
                <div class="deliverable-actions">
                  ${d.tracesUrl ? `<button type="button" class="ds-btn ds-btn--primary js-open-output" data-slug="${esc(d.slug)}" style="padding:0.62em 1.1em;font-size:0.8125rem">Inspect full run &amp; storyboard ${arrowSvg}</button>` : ''}
                  ${d.videoUrl ? `<a class="outputs-link" href="${esc(d.videoUrl)}" target="_blank" rel="noopener">final.mp4 ${extSvg}</a>` : ''}
                  ${d.keyframeUrl ? `<a class="outputs-link" href="${esc(d.keyframeUrl)}" target="_blank" rel="noopener">keyframe.png ${extSvg}</a>` : ''}
                  ${d.tracesUrl ? `<a class="outputs-link" href="${esc(d.tracesUrl)}" target="_blank" rel="noopener">traces.json ${extSvg}</a>` : ''}
                </div>
              </div>
            </div>
          </article>`
        }).join('')}
      </div>
    </section>` : ''

  $('view').innerHTML = `
    <div class="empty-wrap">
      <section class="ds-panel ds-panel--spotlight ds-dither-fade" style="padding: 2.6rem 2.4rem">
        <p class="t-eyebrow" style="margin-bottom: 0.85rem">36 Labs × fal · No Slop Allowed</p>
        <h1 class="t-hero" style="max-width: 18ch">Teaching machines what wins human attention</h1>
        <p class="t-muted" style="max-width: 42rem; font-size: 0.98rem; margin: 1.15rem 0 1.75rem">
          Load a brief on the left and run the harness end to end: diverge across creative axes, tournament-select finalists with order-bias checks, iteratively critique against slop flags, and render a multi-shot hero video with native sound.
        </p>
        ${pills ? `<p class="t-eyebrow">Starter briefs</p><div class="preset-pills">${pills}</div>` : ''}
        <dl class="ds-facts" style="margin: 2.2rem -2.4rem -2.6rem">
          <div><dt>01 · Diverge</dt><dd>Multi-axis</dd></div>
          <div><dt>02 · Select</dt><dd>A/B Swapped</dd></div>
          <div><dt>03 · Develop</dt><dd>Slop-gated</dd></div>
          <div><dt>04 · Showdown</dt><dd>Hero + Video</dd></div>
        </dl>
      </section>
      ${deliverablesHtml}
    </div>`

  for (const btn of $('view').querySelectorAll('.js-preset-pill')) {
    btn.onclick = () => {
      const b = loadedBriefs.find((x) => x.name === btn.dataset.name)
      if (!b) return
      $('presets').value = b.name
      $('brief').value = b.text
      $('brief').focus()
    }
  }
  for (const btn of $('view').querySelectorAll('.js-open-output')) {
    btn.onclick = () => openDeliverable(btn.dataset.slug)
  }
}

async function start() {
  const brief = $('brief').value.trim()
  if (!brief) return $('brief').focus()
  $('go').disabled = true
  try {
    const res = await fetch('/api/runs', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        brief,
        options: {
          concepts: +$('concepts').value,
          finalists: +$('finalists').value,
          maxIters: +$('iters').value,
          video: $('video').checked,
        },
      }),
    }).then((r) => r.json())
    if (res.id) {
      activeTab = 'all'
      for (const t of $('stage-tabs').querySelectorAll('.ds-tab')) t.classList.toggle('is-active', t.dataset.tab === 'all')
      openRun(res.id)
    }
  } finally {
    $('go').disabled = false
  }
}

// gen guards against a stale in-flight poll drawing or rescheduling after you switch runs.
let gen = 0
function routeTo(target) {
  if (target.startsWith('output:')) openDeliverable(target.slice('output:'.length))
  else openRun(target)
}

function openRun(id) {
  current = id
  location.hash = id
  clearTimeout(timer)
  lastKey = ''
  gen++
  renderOutputsRail()
  poll(gen)
}

async function openDeliverable(slug) {
  if (!slug) return
  const d = loadedOutputs.find((x) => x.slug === slug)
  const tracesUrl = d?.tracesUrl || `/outputs/${encodeURIComponent(slug)}/traces.json`
  current = 'output:' + slug
  location.hash = current
  clearTimeout(timer)
  lastKey = ''
  const g = ++gen
  renderOutputsRail()
  refreshRuns().catch(() => {})

  try {
    const t = await fetch(tracesUrl).then((r) => (r.ok ? r.json() : null))
    if (g !== gen) return
    if (!t) {
      $('view').innerHTML = '<div class="empty-wrap"><p class="t-muted">Deliverable trace not found.</p></div>'
      return
    }
    const run = hydrateFromTrace(slug, d, t)
    lastRun = run
    activeTab = 'all'
    for (const tab of $('stage-tabs').querySelectorAll('.ds-tab')) tab.classList.toggle('is-active', tab.dataset.tab === 'all')
    render(run)
  } catch {
    if (g === gen) $('view').innerHTML = '<div class="empty-wrap"><p class="t-muted">Failed to load deliverable trace.</p></div>'
  }
}

function hydrateFromTrace(slug, d, t) {
  const remoteImg = t.final?.image ?? null
  const remoteVid = t.final?.video ?? null
  const localImg = d?.keyframeUrl ?? null
  const localVid = d?.videoUrl ?? null

  const renders = (t.renders ?? []).map((r) => {
    const url = r.kind === 'video' && localVid && r.url === remoteVid
      ? localVid
      : r.kind === 'image' && localImg && r.url === remoteImg
        ? localImg
        : r.url
    const frames = Array.isArray(r.frames)
      ? r.frames.map((f) => (localImg && f === remoteImg ? localImg : f))
      : undefined
    return {
      ...r,
      url,
      frames,
      ms: r.ms ?? 0,
      estUsd: r.estUsd ?? 0,
    }
  })

  const conceptId = t.final?.conceptId
  const imageRender = conceptId
    ? renders.find((r) => r.id === `${conceptId}-final`) ?? renders.find((r) => r.kind === 'image' && r.conceptId === conceptId)
    : undefined
  const videoRender = conceptId
    ? renders.filter((r) => r.kind === 'video' && r.conceptId === conceptId).at(-1)
    : undefined

  return {
    id: t.run_id || slug,
    brief: t.brief_text || '',
    status: t.status || 'done',
    startedAt: Date.parse(t.started_at) || Date.now(),
    finishedAt: Date.parse(t.finished_at) || Date.now(),
    options: t.options || { video: Boolean(videoRender) },
    concepts: (t.concepts ?? []).map((c) => ({ medium: 'video', whyItWorks: '', ...c })),
    matches: t.matches ?? [],
    renders,
    final: conceptId ? {
      conceptId,
      reason: t.final?.reason || 'Selected winner.',
      image: imageRender,
      video: videoRender,
    } : undefined,
    outputs: {
      dir: `outputs/${slug}`,
      video: localVid ?? t.output_video ?? undefined,
      image: localImg ?? t.output_keyframe ?? undefined,
      traces: d?.tracesUrl ?? `outputs/${slug}/traces.json`,
    },
    spend: {
      usd: Number(t.spend_usd_estimate ?? 0),
      calls: Array.isArray(t.steps) ? t.steps.length : 0,
    },
    events: (t.decisions ?? []).map((ev) => ({ t: ev.t_ms ?? 0, stage: ev.stage ?? 'done', message: ev.message ?? '' })),
    error: t.error ?? undefined,
  }
}

async function refreshRuns() {
  const runs = await fetch('/api/runs').then((r) => r.json())
  $('runs-count').textContent = runs.length ? String(runs.length) : ''
  $('runs').innerHTML = runs.map((r) => `
    <a href="#${esc(r.id)}" data-id="${esc(r.id)}" class="run-link ${r.id === current ? 'is-active' : ''}">
      <span class="run-dot ${esc(r.status)}"></span>
      <span class="run-link-body">
        <span class="run-link-id">${esc(r.id)}</span>
        <span class="run-link-brief">${esc(r.brief.replace(/^#+\s*/, '').slice(0, 64))}</span>
      </span>
      ${arrowSvg}
    </a>`).join('') || '<p class="t-muted" style="padding:0.75rem 0.25rem;font-size:0.8rem">No runs yet.</p>'

  for (const a of $('runs').querySelectorAll('a.run-link')) {
    a.onclick = (e) => { e.preventDefault(); openRun(a.dataset.id) }
  }
}

async function poll(g = gen) {
  if (!current || current.startsWith('output:') || g !== gen) return
  let run
  try {
    run = await fetch('/api/runs/' + current).then((r) => (r.ok ? r.json() : null))
  } catch {
    if (g === gen) timer = setTimeout(() => poll(g), 3000)
    return
  }
  if (g !== gen) return
  if (!run) {
    $('view').innerHTML = '<div class="empty-wrap"><p class="t-muted">Run not found.</p></div>'
    return
  }
  lastRun = run
  render(run)
  refreshRuns().catch(() => {})
  if (run.status === 'running') timer = setTimeout(() => poll(g), 1200)
}

function media(r, playable = true, poster = '') {
  if (!r) return ''
  const url = String(r.url ?? '')
  const isVideo = r.kind === 'video' && !url.startsWith('data:image/') && !String(r.endpoint ?? '').startsWith('mock:')
  return isVideo
    ? `<video src="${esc(url)}" ${poster ? `poster="${esc(poster)}"` : ''} autoplay loop muted playsinline ${playable ? 'controls' : ''}></video>`
    : `<img src="${esc(url)}" loading="lazy" alt="${esc(r.id)}" />`
}

function stageProgress(run) {
  if (run.status === 'done') return { pct: 100, step: 5, label: 'Done' }
  const stages = new Set(run.events.map((e) => e.stage))
  if (stages.has('video')) return { pct: 96, step: 5, label: 'Video Storyboard' }
  if (stages.has('final')) return { pct: 90, step: 5, label: 'Hero Render' }
  if (stages.has('showdown')) return { pct: 80, step: 4, label: 'Showdown' }
  if (stages.has('draft') || stages.has('critique') || stages.has('revise')) return { pct: 62, step: 3, label: 'Develop' }
  if (stages.has('select')) return { pct: 42, step: 2, label: 'Select' }
  if (stages.has('diverge')) return { pct: 24, step: 1, label: 'Diverge' }
  return { pct: 10, step: 1, label: 'Starting' }
}

function render(run) {
  const elapsed = Math.max(0, Math.round(((run.finishedAt ?? Date.now()) - run.startedAt) / 1000))
  const prog = stageProgress(run)

  $('status').hidden = false
  $('status').textContent = run.status
  $('status').className = 'ds-badge ds-badge--' + run.status
  $('stats').textContent = `${elapsed}s · ~$${run.spend.usd.toFixed(3)} · ${run.spend.calls} calls`
  $('stage-tabs').hidden = false

  $('progress').style.width = prog.pct + '%'
  $('progress').className = 'ds-topbar-progress' + (run.status === 'done' ? ' is-done' : run.status === 'error' ? ' is-error' : '')

  if (!$('brief').value) $('brief').value = run.brief

  const finalists = run.concepts.filter((c) => c.status === 'finalist' || c.status === 'winner')
  const videos = run.renders.filter((r) => r.kind === 'video')
  $('cnt-video').textContent = videos.length || ''
  $('cnt-develop').textContent = finalists.length || ''
  $('cnt-diverge').textContent = run.concepts.length || ''
  $('cnt-select').textContent = run.matches.length || ''
  $('cnt-trace').textContent = run.events.length || ''

  const byId = Object.fromEntries(run.concepts.map((c) => [c.id, c]))
  const wins = {}
  for (const m of run.matches) if (m.round.startsWith('Concepts')) wins[m.winner] = (wins[m.winner] ?? 0) + 1

  const show = (tab) => activeTab === 'all' || activeTab === tab
  let html = ''

  // Pipeline 5-Stage Header + Architectural KPI Strip
  const pipeLabels = ['Diverge', 'Select', 'Develop', 'Showdown', run.options?.video || videos.length ? 'Hero + Video' : 'Hero']
  html += `<div class="pipeline-strip">` + pipeLabels.map((lbl, idx) => {
    const n = idx + 1
    const cls = run.status === 'done' || n < prog.step ? 'is-done' : n === prog.step ? 'is-active' : ''
    return `<div class="pipe-step ${cls}"><span class="pipe-num">${n}</span><span>${lbl}</span></div>`
  }).join('') + `</div>`

  html += `<dl class="ds-facts">
    <div><dt>Active Stage</dt><dd>${esc(prog.label)}</dd></div>
    <div><dt>Elapsed</dt><dd>${elapsed}s</dd></div>
    <div><dt>Est. Spend</dt><dd>~$${run.spend.usd.toFixed(3)}<small>${run.spend.calls} calls</small></dd></div>
    <div><dt>Funnel</dt><dd>${run.concepts.length} → ${finalists.length}<small>${run.renders.length} renders</small></dd></div>
  </dl>`

  if (run.error) {
    html += `<div class="error-banner">ERROR · ${esc(run.error)}</div>`
  }

  // 1. WINNER SHOWCASE
  if (run.final && show('winner')) {
    const first = run.renders.find((r) => r.conceptId === run.final.conceptId && r.version === 1 && r.kind === 'image')
    const heroRender = run.final.video ?? run.final.image
    const heroImg = run.final.image
    const c = byId[run.final.conceptId]
    const activeCrit = heroRender?.critique ?? heroImg?.critique
    const finalScore = activeCrit?.score ?? '–'
    const finalSlop = activeCrit?.slop ?? []
    const strengths = (heroRender?.critique?.strengths?.length ? heroRender.critique.strengths : heroImg?.critique?.strengths) ?? []

    html += `<section class="stage-section">
      <div class="stage-head">
        <div>
          <p class="t-eyebrow">05 / Selected Output</p>
          <h2 class="t-headline" style="font-size:1.55rem;margin-top:0.2rem">Winner</h2>
        </div>
        <span class="t-eyebrow">${esc(heroRender?.endpoint ?? '')}</span>
      </div>

      <div class="ds-panel ds-panel--spotlight ds-dither-fade">
        <div class="winner-grid">
          ${first ? `
          <div class="winner-draft-col">
            <div class="cv-box cv-box--muted">
              <span class="cv-plate">V1 DRAFT · ${first.critique?.score ?? '–'}/10</span>
              <div class="media-frame js-open-render" data-render-id="${esc(first.id)}">${media(first, false)}</div>
            </div>
            <div class="media-caption">Initial draft (text &amp; anatomy unjudged)</div>
          </div>` : ''}

          <div class="winner-media-col">
            <div class="cv-box ${finalSlop.length ? 'cv-box--amber' : 'cv-box--green'}">
              <span class="cv-plate">WINNER · ${finalScore}/10 ${run.final.video ? '· VIDEO' : '· HERO'}</span>
              <div class="media-frame js-open-render" data-render-id="${esc(heroRender?.id ?? '')}">${media(heroRender, true, heroImg?.url ?? '')}</div>
            </div>
            <div class="media-caption" style="color:${finalSlop.length ? 'var(--cv-amber)' : 'var(--cv-green)'}">
              ${esc(run.final.conceptId.toUpperCase())} · full rubric · ${finalSlop.length ? `${finalSlop.length} slop flag(s)` : 'zero slop'}
            </div>
          </div>

          <div class="winner-copy">
            <p class="t-eyebrow" style="color:var(--cv-green)">${esc(c?.axis ?? 'Winner')}${c?.medium ? ` · ${esc(c.medium)}` : ''}</p>
            <h3 class="t-headline" style="font-size:1.7rem">${esc(c?.title ?? run.final.conceptId)}</h3>
            <p class="t-statement" style="font-size:1.05rem;color:var(--ink)">${esc(c?.hook ?? '')}</p>
            ${c?.moment ? `<p class="t-muted" style="margin:0;font-size:0.86rem"><strong style="color:var(--ink)">Moment:</strong> ${esc(c.moment)}</p>` : ''}
            <div class="winner-reason">${esc(run.final.reason)}</div>
            ${strengths.length ? `<div class="render-chips">${strengths.map((s) => `<span class="ds-chip ds-chip--ok">✓ ${esc(s)}</span>`).join('')}</div>` : ''}
            <div style="display:flex;flex-wrap:wrap;gap:0.55rem">
              <button type="button" class="ds-btn ds-btn--outline js-open-render" data-render-id="${esc(heroRender?.id ?? '')}">
                Inspect ${run.final.video ? 'video, shots &amp; frames' : 'prompt &amp; critique'} ${arrowSvg}
              </button>
              ${run.final.video && heroImg ? `<button type="button" class="ds-btn ds-btn--subtle js-open-render" data-render-id="${esc(heroImg.id)}">Inspect hero keyframe</button>` : ''}
            </div>
            ${renderOutputsBar(run.outputs)}
          </div>
        </div>
      </div>
    </section>`
  }

  // 1B. VIDEO STORYBOARD & TAKES
  if (videos.length && show('video')) {
    const heroImgUrl = run.final?.image?.url ?? ''
    html += `<section class="stage-section">
      <div class="stage-head">
        <div>
          <p class="t-eyebrow">05B / Motion &amp; Native Audio</p>
          <h2 class="t-headline" style="font-size:1.45rem;margin-top:0.2rem">Video: storyboard → generate → critique</h2>
        </div>
        <span class="t-eyebrow">${videos.length} take${videos.length > 1 ? 's' : ''} · first / mid / last frame review</span>
      </div>
      <div class="video-takes-grid">` +
      videos.map((r) => {
        const isBestVideo = r.id === run.final?.video?.id
        const hasSlop = (r.critique?.slop?.length ?? 0) > 0
        const boxCls = !r.critique
          ? 'cv-box--blue'
          : hasSlop && !isBestVideo
            ? 'cv-box--coral'
            : isBestVideo && !hasSlop
              ? 'cv-box--green'
              : 'cv-box--amber'
        const plate = !r.critique
          ? `TAKE ${r.version} · JUDGING…`
          : `${isBestVideo ? 'SELECTED · ' : ''}TAKE ${r.version} · ${r.critique.score}/10`
        const shots = r.shots ?? []
        const frames = r.frames ?? []
        const totalSecs = shots.reduce((acc, s) => acc + (s.seconds || 0), 0)

        return `<article class="video-take-card cv-box ${boxCls}">
          <div class="render-top">
            <span class="cv-plate">${esc(plate)}</span>
            <span class="video-take-meta">${totalSecs ? `${totalSecs}s · ` : ''}${shots.length ? `${shots.length} shot${shots.length > 1 ? 's' : ''} · ` : ''}${esc(shortEndpoint(r.endpoint))}</span>
          </div>
          <div class="video-take-inner">
            <div class="video-take-media">
              <div class="media-frame js-open-render" data-render-id="${esc(r.id)}">${media(r, true, frames[0] || heroImgUrl)}</div>
              <button type="button" class="video-inspect-btn js-open-render" data-render-id="${esc(r.id)}">Inspect take ${arrowSvg}</button>
            </div>
            <div class="video-take-body">
              <div class="render-score-row">
                <div style="display:flex;align-items:baseline;gap:0.45rem">
                  <span class="render-score">${r.critique ? r.critique.score : '…'}<span style="font-size:0.72rem;color:var(--muted)">/10</span></span>
                  ${r.critique && hasSlop ? `<span class="t-eyebrow" style="color:var(--cv-coral)">eff ${effScore(r.critique)}</span>` : ''}
                </div>
                <div class="render-chips">
                  <span class="ds-chip ${r.critique?.verdict === 'ship' ? 'ds-chip--ok' : r.critique?.verdict === 'kill' ? 'ds-chip--slop' : 'ds-chip--warn'}">${esc(r.critique?.verdict ?? 'judging')}</span>
                  ${r.critique && !hasSlop ? '<span class="ds-chip ds-chip--ok">no slop</span>' : ''}
                </div>
              </div>

              ${r.changeSummary ? `<div class="render-delta">↻ ${esc(r.changeSummary)}</div>` : ''}

              ${(r.critique?.slop ?? []).length ? `
                <div class="render-chips">
                  ${r.critique.slop.map((s) => `<span class="ds-chip ds-chip--slop" title="${esc(s.evidence)}">${esc(s.flag)}</span>`).join('')}
                </div>` : ''}

              ${shots.length ? `
                <div class="video-block">
                  <div class="video-block-head">
                    <span class="t-eyebrow">Shot Plan</span>
                    <span class="t-eyebrow">${shots.map((s) => `${s.seconds}s`).join(' + ')} = ${totalSecs}s</span>
                  </div>
                  <div class="shot-list">
                    ${shots.map((s, i) => `
                      <div class="shot-row">
                        <span class="shot-tag">S${i + 1} · ${s.seconds}s</span>
                        <span class="shot-text">${formatShotPrompt(s.prompt)}</span>
                      </div>`).join('')}
                  </div>
                </div>` : ''}

              ${frames.length ? `
                <div class="video-block">
                  <div class="video-block-head">
                    <span class="t-eyebrow">Critic Frames</span>
                    <span class="t-eyebrow">First · Mid · Last</span>
                  </div>
                  <div class="frame-strip">
                    ${frames.map((u, idx) => {
                      const lbl = idx === 0 ? '01 · FIRST' : idx === frames.length - 1 ? `0${idx + 1} · LAST` : `0${idx + 1} · MID`
                      return `<div class="frame-cell js-open-render" data-render-id="${esc(r.id)}" data-frame-idx="${idx}" title="Inspect ${lbl} in lightbox">
                        <img src="${esc(u)}" loading="lazy" alt="${esc(lbl)}" />
                        <span class="frame-label">${lbl}</span>
                      </div>`
                    }).join('')}
                  </div>
                </div>` : ''}

              ${r.critique?.fixes?.length ? `<div class="render-fixes">fix: ${esc(r.critique.fixes.slice(0, 2).join('; '))}</div>` : ''}
            </div>
          </div>
        </article>`
      }).join('') +
      `</div>
      ${activeTab === 'video' ? renderOutputsBar(run.outputs) : ''}
    </section>`
  }

  // 2. DEVELOP LANES
  if (finalists.length && show('develop')) {
    html += `<section class="stage-section">
      <div class="stage-head">
        <div>
          <p class="t-eyebrow">03 / Iterative Critique Loop</p>
          <h2 class="t-headline" style="font-size:1.45rem;margin-top:0.2rem">Develop: draft → critique → revise</h2>
        </div>
        <span class="t-eyebrow">Click any frame to inspect prompt &amp; evidence</span>
      </div>`

    for (const c of finalists) {
      const rs = run.renders.filter((r) => r.conceptId === c.id && r.kind === 'image' && !r.id.endsWith('-final'))
      const best = rs.reduce((b, r) => (r.critique && !r.discarded && (!b || effScore(r.critique) > effScore(b.critique)) ? r : b), null)

      html += `<div class="lane">
        <div class="lane-head">
          <span class="ds-chip ${c.status === 'winner' ? 'ds-chip--ok' : ''}">${esc(c.id.toUpperCase())} · ${esc(c.status)}</span>
          <h3 class="t-title">${esc(c.title)}</h3>
          <span class="t-eyebrow">${esc(c.axis)} · ${esc(c.hook)}</span>
        </div>
        <div class="strip">`

      if (!rs.length) {
        html += `<div class="render-card"><div class="cv-reticle" style="aspect-ratio:9/16;display:grid;place-items:center;padding:1rem;text-align:center"><span class="t-eyebrow" style="color:var(--cv-violet)">RENDERING V1…</span></div></div>`
      } else {
        html += rs.map((r) => {
          const isBest = r === best
          const hasSlop = (r.critique?.slop?.length ?? 0) > 0
          if (!r.critique) {
            return `<div class="render-card">
              <div class="cv-reticle" style="padding:3px">
                <div class="media-frame js-open-render" data-render-id="${esc(r.id)}">${media(r, false)}</div>
              </div>
              <div class="render-body">
                <div class="render-score-row">
                  <span class="t-eyebrow" style="color:var(--cv-violet)">V${r.version} · JUDGING…</span>
                </div>
                ${r.changeSummary ? `<div class="render-delta">↻ ${esc(r.changeSummary)}</div>` : ''}
              </div>
            </div>`
          }

          const boxCls = r.discarded || hasSlop
            ? 'cv-box--coral'
            : isBest
              ? 'cv-box--green'
              : 'cv-box--amber'
          const plateLabel = r.discarded
            ? `V${r.version} · DISCARDED`
            : isBest
              ? `BEST · V${r.version} · ${r.critique.score}/10`
              : `V${r.version} · ${r.critique.score}/10 · ${r.critique.verdict}`

          return `<div class="render-card ${r.discarded ? 'is-discarded' : ''}">
            <div class="cv-box ${boxCls}">
              <div class="render-top"><span class="cv-plate">${esc(plateLabel)}</span></div>
              <div class="media-frame js-open-render" data-render-id="${esc(r.id)}">${media(r, false)}</div>
              <div class="render-body">
                <div class="render-score-row">
                  <span class="render-score">${r.critique.score}<span style="font-size:0.72rem;color:var(--muted)">/10</span></span>
                  <span class="t-eyebrow">${esc(r.critique.verdict)}${hasSlop ? ` · eff ${effScore(r.critique)}` : ''}</span>
                </div>
                ${r.changeSummary ? `<div class="render-delta">↻ ${esc(r.changeSummary)}</div>` : ''}
                <div class="render-chips">
                  ${r.critique.slop.map((s) => `<span class="ds-chip ds-chip--slop" title="${esc(s.evidence)}">${esc(s.flag)}</span>`).join('')}
                  ${!hasSlop ? '<span class="ds-chip ds-chip--ok">no slop</span>' : ''}
                </div>
                ${r.critique.fixes.length ? `<div class="render-fixes">fix: ${esc(r.critique.fixes.join('; '))}</div>` : ''}
              </div>
            </div>
          </div>`
        }).join('')
      }

      html += `</div></div>`
    }
    html += `</section>`
  }

  // 3. DIVERGE CONCEPTS
  if (run.concepts.length && show('diverge')) {
    html += `<section class="stage-section">
      <div class="stage-head">
        <div>
          <p class="t-eyebrow">01 / Creative Exploration</p>
          <h2 class="t-headline" style="font-size:1.45rem;margin-top:0.2rem">Diverge: ${run.concepts.length} concepts</h2>
        </div>
      </div>
      <div class="concepts-grid">` +
      run.concepts.map((c) => `
        <article class="concept-card ${esc(c.status)}">
          <div class="concept-head">
            <span class="t-eyebrow" style="color:var(--ink)">${esc(c.id)} · ${esc(c.axis)}</span>
            <span class="ds-chip ${c.status === 'winner' ? 'ds-chip--ok' : c.status === 'finalist' ? 'ds-chip--warn' : ''}">${esc(c.status)} · ${wins[c.id] ?? 0}w</span>
          </div>
          <h3 class="t-title">${esc(c.title)}</h3>
          <p style="margin:0;color:var(--ink);font-size:0.82rem">${esc(c.hook)}</p>
          ${c.moment ? `<p class="t-muted" style="margin:0;font-size:0.76rem">${esc(c.moment)}</p>` : ''}
        </article>`).join('') +
      `</div></section>`
  }

  // 4. SELECT PAIRWISE MATCHES
  if (run.matches.length && show('select')) {
    const labelOf = (id) => byId[id] ? `${id} · ${byId[id].title}` : id
    html += `<section class="stage-section">
      <div class="stage-head">
        <div>
          <p class="t-eyebrow">02 &amp; 04 / Tournament Brackets</p>
          <h2 class="t-headline" style="font-size:1.45rem;margin-top:0.2rem">Select: pairwise judging</h2>
        </div>
        <span class="t-eyebrow">A/B swapped on every match to catch order bias</span>
      </div>
      <div style="overflow-x:auto">
        <table class="match-table">
          <thead><tr><th>Round</th><th>Matchup</th><th>Winner</th><th>Bias Check</th><th>Judge Reason</th></tr></thead>
          <tbody>` +
          run.matches.map((m) => `<tr>
            <td class="t-eyebrow" style="white-space:nowrap">${esc(m.round)}</td>
            <td style="white-space:nowrap">${esc(m.a)} vs ${esc(m.b)}</td>
            <td style="white-space:nowrap"><strong style="color:var(--ink-strong)">${esc(labelOf(m.winner))}</strong></td>
            <td style="white-space:nowrap">${m.consistent ? '<span class="ds-chip ds-chip--ok">consistent</span>' : '<span class="ds-chip ds-chip--warn" title="Swapping A/B changed the verdict, or one pass failed">order-biased</span>'}</td>
            <td class="t-muted">${esc(m.reason)}</td>
          </tr>`).join('') +
          `</tbody>
        </table>
      </div>
    </section>`
  }

  // 5. LIVE TRACE
  if (show('trace')) {
    html += `<section class="stage-section" style="border-bottom:0">
      <div class="stage-head">
        <div>
          <p class="t-eyebrow">Telemetry Log</p>
          <h2 class="t-headline" style="font-size:1.45rem;margin-top:0.2rem">Trace</h2>
        </div>
        <span class="t-eyebrow">${run.events.length} events</span>
      </div>
      <div class="trace-log log">` +
      run.events.map((e) => `
        <div class="trace-line ${e.stage === 'error' ? 'is-error' : ''}">
          <span class="trace-t">${(e.t / 1000).toFixed(1)}s</span>
          <span class="trace-stage s-${esc(e.stage)}">${esc(e.stage)}</span>
          <span class="trace-msg">${esc(e.message)}</span>
        </div>`).join('') +
      `</div>
    </section>`
  }

  // Skip identical redraws so playing videos don't restart; preserve scroll positions across redraws.
  const renderKey = activeTab + '::' + html
  if (renderKey === lastKey) return
  lastKey = renderKey

  const oldLog = $('view').querySelector('.log')
  const follow = !oldLog || oldLog.scrollHeight - oldLog.scrollTop - oldLog.clientHeight < 24
  const logTop = oldLog?.scrollTop ?? 0
  const strips = [...$('view').querySelectorAll('.strip')].map((s) => s.scrollLeft)

  $('view').innerHTML = html

  const log = $('view').querySelector('.log')
  if (log) log.scrollTop = follow ? log.scrollHeight : logTop
  $('view').querySelectorAll('.strip').forEach((s, i) => { s.scrollLeft = strips[i] ?? 0 })

  for (const el of $('view').querySelectorAll('.js-open-render')) {
    el.onclick = (e) => {
      e.stopPropagation()
      const fIdx = el.dataset.frameIdx !== undefined ? Number(el.dataset.frameIdx) : null
      openLightbox(el.dataset.renderId, fIdx)
    }
  }
}

function openLightbox(renderId, initialFrameIdx = null) {
  if (!lastRun || !renderId) return
  const r = lastRun.renders.find((x) => x.id === renderId)
  if (!r) return
  const c = lastRun.concepts.find((x) => x.id === r.conceptId)
  const crit = r.critique
  const shots = r.shots ?? []
  const frames = r.frames ?? []
  const totalSecs = shots.reduce((acc, s) => acc + (s.seconds || 0), 0)
  const metaParts = [
    r.id,
    r.endpoint,
    r.ms ? `${(r.ms / 1000).toFixed(1)}s` : null,
    r.estUsd ? `~$${r.estUsd.toFixed(3)}` : null,
  ].filter(Boolean).join(' · ')

  $('lightbox-content').innerHTML = `
    <div class="lightbox-inner">
      <div class="lightbox-media" id="lb-stage"></div>
      <div class="lightbox-meta">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem">
          <div>
            <p class="t-eyebrow">${esc(metaParts)}</p>
            <h3 class="t-title" style="font-size:1.25rem;margin-top:0.25rem">${esc(c?.title ?? r.conceptId)}</h3>
          </div>
          <button type="button" class="ds-btn ds-btn--subtle" id="lb-close">Close</button>
        </div>

        ${crit ? `
          <div style="display:flex;align-items:center;gap:0.55rem;flex-wrap:wrap">
            <span class="ds-badge ${crit.slop.length ? 'ds-badge--error' : 'ds-badge--live'}">Score ${crit.score}/10 · ${esc(crit.verdict)}${crit.slop.length ? ` · eff ${effScore(crit)}` : ''}</span>
            ${crit.slop.length ? crit.slop.map((s) => `<span class="ds-chip ds-chip--slop">${esc(s.flag)}</span>`).join('') : '<span class="ds-chip ds-chip--ok">no slop</span>'}
          </div>
          ${crit.slop.length ? `<div style="font-size:0.8rem;color:var(--cv-coral);display:flex;flex-direction:column;gap:0.28rem">${crit.slop.map((s) => `<div>• <strong>${esc(s.flag)}:</strong> ${esc(s.evidence)}</div>`).join('')}</div>` : ''}
          ${crit.strengths.length ? `<div style="font-size:0.8rem;color:var(--ink-secondary)"><strong style="color:var(--ink)">Strengths:</strong> ${esc(crit.strengths.join(' · '))}</div>` : ''}
          ${crit.fixes.length ? `<div style="font-size:0.8rem;color:var(--ink-secondary)"><strong style="color:var(--ink)">Fixes:</strong> ${esc(crit.fixes.join(' · '))}</div>` : ''}
        ` : ''}

        ${r.changeSummary ? `<div style="font-size:0.8rem;color:var(--cv-amber)">↻ ${esc(r.changeSummary)}</div>` : ''}

        ${shots.length ? `
          <div class="video-block">
            <div class="video-block-head">
              <span class="t-eyebrow">Storyboard Shot Plan</span>
              <span class="t-eyebrow">${shots.length} shot${shots.length > 1 ? 's' : ''} · ${totalSecs}s total</span>
            </div>
            <div class="shot-list">
              ${shots.map((s, i) => `
                <div class="shot-row">
                  <span class="shot-tag">S${i + 1} · ${s.seconds}s</span>
                  <span class="shot-text">${formatShotPrompt(s.prompt)}</span>
                </div>`).join('')}
            </div>
          </div>
        ` : ''}

        ${frames.length ? `
          <div class="video-block">
            <div class="video-block-head">
              <span class="t-eyebrow">3-Frame Critic Review</span>
              <button type="button" class="ds-btn ds-btn--outline" id="lb-show-clip" style="padding:0.25em 0.65em;font-size:0.68rem">Motion clip</button>
            </div>
            <div class="frame-strip" id="lb-frames">
              ${frames.map((u, idx) => {
                const lbl = idx === 0 ? '01 · FIRST' : idx === frames.length - 1 ? `0${idx + 1} · LAST` : `0${idx + 1} · MID`
                return `<div class="frame-cell js-lb-frame" data-idx="${idx}" title="Preview ${lbl}">
                  <img src="${esc(u)}" alt="${esc(lbl)}" />
                  <span class="frame-label">${lbl}</span>
                </div>`
              }).join('')}
            </div>
          </div>
        ` : ''}

        <div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.4rem">
            <span class="t-eyebrow">${r.kind === 'video' ? 'Compiled Video Prompt' : 'Visual Prompt'}</span>
            <button type="button" class="ds-btn ds-btn--outline" id="lb-copy" style="padding:0.3em 0.7em;font-size:0.72rem">Copy prompt</button>
          </div>
          <div class="prompt-box">${esc(r.prompt)}</div>
        </div>
      </div>
    </div>`

  const showStageMedia = (frameIdx) => {
    const stage = $('lb-stage')
    for (const v of stage.querySelectorAll('video')) v.pause()
    if (frameIdx !== null && frames[frameIdx]) {
      const lbl = frameIdx === 0 ? '01 · FIRST FRAME' : frameIdx === frames.length - 1 ? `0${frameIdx + 1} · LAST FRAME` : `0${frameIdx + 1} · MIDDLE FRAME`
      stage.innerHTML = `
        <div class="lightbox-media-toolbar">
          <span class="cv-plate" style="--cv:var(--cv-cyan)">${lbl}</span>
          <button type="button" class="ds-btn ds-btn--subtle" id="lb-back-video" style="padding:0.35em 0.75em;font-size:0.72rem">Back to clip</button>
        </div>
        <img src="${esc(frames[frameIdx])}" alt="${esc(lbl)}" />`
      const backBtn = $('lb-back-video')
      if (backBtn) backBtn.onclick = () => showStageMedia(null)
    } else {
      stage.innerHTML = media(r, true, frames[0] || '')
    }
    for (const cell of $('lightbox-content').querySelectorAll('.js-lb-frame')) {
      cell.classList.toggle('is-selected', frameIdx !== null && Number(cell.dataset.idx) === frameIdx)
    }
  }

  showStageMedia(initialFrameIdx)

  for (const cell of $('lightbox-content').querySelectorAll('.js-lb-frame')) {
    cell.onclick = () => showStageMedia(Number(cell.dataset.idx))
  }
  const clipBtn = $('lb-show-clip')
  if (clipBtn) clipBtn.onclick = () => showStageMedia(null)

  $('lb-close').onclick = () => $('lightbox').close()
  $('lb-copy').onclick = async () => {
    await navigator.clipboard?.writeText(r.prompt).catch(() => {})
    $('lb-copy').textContent = 'Copied'
  }
  if (!$('lightbox').open) $('lightbox').showModal()
}

window.onhashchange = () => {
  const id = location.hash.slice(1)
  if (id && id !== current) routeTo(id)
}

boot()
</script>
</body>
</html>
