title = "Recliner gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "tavily-api-key"
description = "Tavily API key"
regex = '''tvly-[A-Za-z0-9_-]{20,}'''

[[rules]]
id = "fal-api-key-assignment"
description = "fal API key assigned in a file"
regex = '''(?i)FAL_KEY\s*[=:]\s*["']?[A-Za-z0-9_:\-]{16,}'''

[[rules]]
id = "openai-api-key"
description = "OpenAI API key"
regex = '''sk-(?:proj-)?[A-Za-z0-9_-]{20,}'''

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''sk-ant-[A-Za-z0-9_-]{20,}'''
